name: Manual Validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        required: true
        default: verify
        type: choice
        options:
          - verify
          - e2e-all
          - release-check

permissions:
  contents: read

jobs:
  manual:
    runs-on: [self-hosted, linux, x64, tanstack-ci]
    timeout-minutes: 90
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # pnpm/action-setup@v4.0.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.3

      - name: Setup Node.js
        # actions/setup-node@v4.2.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps

      - name: Run selected suite
        env:
          CI: true
        run: |
          case "${{ inputs.suite }}" in
            verify) pnpm verify ;;
            e2e-all) pnpm test:e2e:all ;;
            release-check) pnpm release:check ;;
          esac
