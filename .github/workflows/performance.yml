name: Performance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  budgets:
    name: Bundle budgets (non-blocking initially)
    runs-on: [self-hosted, linux, x64, tanstack-ci]
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # pnpm/action-setup@v4.0.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.3

      - name: Setup Node.js
        # actions/setup-node@v4.2.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Bundle report
        run: pnpm bundle:report

      - name: Enforce budgets
        run: pnpm perf
