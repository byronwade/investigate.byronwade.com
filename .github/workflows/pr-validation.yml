# Pull request validation — self-hosted runners only
name: PR Validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  RUNNER_LABELS: self-hosted,linux,x64,tanstack-ci

jobs:
  validate:
    name: Quality pipeline
    runs-on: [self-hosted, linux, x64, tanstack-ci]
    timeout-minutes: 45
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # pnpm/action-setup@v4.0.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.3

      - name: Setup Node.js
        # actions/setup-node@v4.2.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Validate lockfile and install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Verify
        run: pnpm verify
        env:
          CI: true

      - name: Production dependency audit
        run: pnpm deps:audit
