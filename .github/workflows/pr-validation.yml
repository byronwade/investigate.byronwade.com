# Pull request validation — self-hosted runners only
name: PR Validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  RUNNER_LABELS: self-hosted,linux,x64,tanstack-ci

jobs:
  validate:
    name: Quality pipeline
    runs-on: [self-hosted, linux, x64, tanstack-ci]
    timeout-minutes: 45
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup@v4.0.0
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 10.33.3

      - name: Setup Node.js
        # actions/setup-node@v4.2.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Validate lockfile and install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Verify
        run: pnpm verify
        env:
          CI: true

      - name: Production dependency audit
        run: pnpm deps:audit
