name: Feature request
description: Propose a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior and non-goals
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
