name: Bug report
description: Report a defect in Investigate
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets. Security issues → SECURITY.md
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Exact steps, commands, and environment
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / commit
      placeholder: main @ abc123
